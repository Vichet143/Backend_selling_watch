databaseChangeLog:
  - changeSet:
      id: rename-category-name-column
      author: choubvichet1001@gmail.com
      changes:
        - renameColumn:
            tableName: categories
            oldColumnName: category_name
            newColumnName: name
            columnDataType: VARCHAR(50)
        - renameColumn:
            tableName: brand
            oldColumnName: brand_name
            newColumnName: name
            columnDataType: VARCHAR(50)
  - changeSet:
      id: add_unique_inventory_watch_id
      author: choubvichet1001@gmail.com
      changes:
        - addUniqueConstraint:
            tableName: inventory
            columnNames: watch_id
            constraintName: uk_inventory_watch_id

  - changeSet:
      id: add_phone_number_to_order_table
      author: choubvichet1001@gmail.com
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: phone_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

