services:
  postgres-db:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: watchdb
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - backend-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: my-backend
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - postgres-db

    ports:
      - "8080:8080"

    networks:
      - backend-network

volumes:
  postgres-data:
    external: true

networks:
  backend-network:
    driver: bridge